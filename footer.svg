<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" fill="none">
  <defs>
    <pattern id="g1" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" stroke="#1c2430" stroke-width="1"/>
    </pattern>
    <radialGradient id="f" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m"><rect width="1000" height="120" fill="url(#f)"/></mask>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="120" fill="#0d1117"/>
  <g mask="url(#m)"><rect width="1000" height="120" fill="url(#g1)"/></g>
  <rect x="200" y="30" width="600" height="2" fill="url(#line)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="72" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#8b949e">
    THANKS FOR VISITING
  </text>
  <text x="500" y="98" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#58a6ff">
    github.com/wewen06
  </text>
</svg>
