<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none">
  <defs>
    <pattern id="gridSmall" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" stroke="#1c2430" stroke-width="1"/>
    </pattern>
    <pattern id="gridLarge" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" stroke="#2a3646" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1000" height="300" fill="url(#fade)"/>
    </mask>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="#0d1117"/>

  <g mask="url(#gridMask)">
    <rect width="1000" height="300" fill="url(#gridSmall)"/>
    <rect width="1000" height="300" fill="url(#gridLarge)"/>
  </g>

  <circle cx="300" cy="150" r="90" fill="#1f6feb" opacity="0.35" filter="url(#blur)">
    <animate attributeName="cx" values="300;700;300" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.45;0.25" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="170" r="70" fill="#8957e5" opacity="0.25" filter="url(#blur)">
    <animate attributeName="cx" values="700;350;700" dur="14s" repeatCount="indefinite"/>
  </circle>

  <rect x="-200" y="0" width="200" height="300" fill="url(#scan)">
    <animate attributeName="x" values="-200;1000" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#58a6ff" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M 30 60 L 30 30 L 60 30"/>
    <path d="M 970 60 L 970 30 L 940 30"/>
    <path d="M 30 240 L 30 270 L 60 270"/>
    <path d="M 970 240 L 970 270 L 940 270"/>
  </g>

  <text x="500" y="95" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="6" fill="#8b949e">
    PORTFOLIO
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <text x="500" y="160" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="2" fill="url(#nameGrad)">
    WENDY VIRTUS
    <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/>
  </text>

  <line x1="500" y1="185" x2="500" y2="185" stroke="#58a6ff" stroke-width="2" stroke-linecap="round">
    <animate attributeName="x1" values="500;380" dur="1.4s" begin="0.6s" fill="freeze"/>
    <animate attributeName="x2" values="500;620" dur="1.4s" begin="0.6s" fill="freeze"/>
  </line>

  <text x="500" y="222" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="4" fill="#c9d1d9">
    WEB DEVELOPER  /  STUDENT  /  FAST LEARNER
    <animate attributeName="opacity" values="0;1" dur="1.6s" begin="0.8s" fill="freeze"/>
  </text>
</svg>
